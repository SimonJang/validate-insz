name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

  legacy-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 4.x
          package-manager-cache: false
      - name: Smoke-test the declared runtime floor
        run: |
          node <<'JS'
          var assert = require('assert');
          var validate = require('./');
          ['78052010102', '10052010059', '40003200173', '78200010128', '78320110182', '78400010270', '78520110227'].forEach(function (input) {
            assert.strictEqual(validate(input), true);
          });
          ['78-05-20-101-02', '78122000055', '78132000161', '78332010104', '78532010147'].forEach(function (input) {
            assert.strictEqual(validate(input), false);
          });
          JS
